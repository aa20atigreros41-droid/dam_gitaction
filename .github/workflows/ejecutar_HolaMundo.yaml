name: Ejecutar HolaMundo

on:
  push:
    # branches: [ main ]
jobs:
  ejecutar_HolaMundo:
    name: Compilar y ejecutar Java
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargamos repositorio
      uses: actions/checkout@v5    
      
    - name: Compilar
      run: javac src/HolaMundo.java

    - name: Ejecutar programa
      run: java -cp src HolaMundo
        
    